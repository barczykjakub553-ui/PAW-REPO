App\Entity\Location:
    constraints:
        - Symfony\Bridge\Doctrine\Validator\Constraints\UniqueEntity:
            fields: [city, country]
            message: 'This location already exists.'
            groups: [new]
    properties:
        city:
            - NotBlank: { groups: [new, edit] }
            - Length: { min: 2, max: 255, groups: [new, edit] }
            - Regex:
                pattern: '/^[\p{L} \-]+$/u'
                message: 'City name may contain only letters, spaces and hyphens.'
                groups: [new]
        country:
            - NotBlank: { groups: [new, edit] }
            - Choice: { choices: [PL, DE, FR, ES, IT, GB, US], groups: [new, edit] }
        latitude:
            - NotBlank: { groups: [new, edit] }
            - Range: { min: -90, max: 90, groups: [new, edit] }
        longtitude:
            - NotBlank: { groups: [new, edit] }
            - Range: { min: -180, max: 180, groups: [new, edit] }

App\Entity\Measurement:
    properties:
        location:
            - NotNull: { groups: [new, edit] }
        date:
            - NotBlank: { groups: [new, edit] }
            - GreaterThanOrEqual:
                value: today
                message: 'A new forecast cannot be in the past.'
                groups: [new]
        celsius:
            - NotBlank: { groups: [new, edit] }
            - Range: { min: -50, max: 50, groups: [new] }
            - Range: { min: -90, max: 60, groups: [edit] }
